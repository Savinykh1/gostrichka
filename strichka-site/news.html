<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Новини — Стрічкоткацька фабрика</title>
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/theme-default.css" id="themeStylesheet" />
</head>
<body>
  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="index.html">Стрічкоткацька фабрика</a>
      <nav class="nav">
        <a href="index.html" data-i18n="nav_home">Головна</a>
        <a href="news.html" class="active" data-i18n="nav_news">Новини</a>
        <a href="gallery.html" data-i18n="nav_gallery">Галерея</a>
        <a href="projects.html" data-i18n="nav_projects">Наші проєкти</a>
        <a href="about.html" data-i18n="nav_about">Про нас</a>
        <a href="contacts.html" data-i18n="nav_contacts">Контакти</a>
      </nav>
      <div class="header-actions">
        <select id="themeSelect" class="select" aria-label="Theme">
          <option value="default">Default</option>
          <option value="dark">Dark</option>
          <option value="pastel">Pastel</option>
        </select>
        <button class="btn" id="langToggle" type="button">UA / EN</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <h1 data-i18n="news_title">Новини</h1>
        <p class="muted" data-i18n="news_subtitle">
          Швидке додавання: редагуй файл <code>data/posts.json</code>.
        </p>
      </div>

      <div class="toolbar">
        <input id="searchInput" class="input" type="search" placeholder="Пошук..." data-i18n-placeholder="news_search_ph" />
        <select id="tagFilter" class="select" aria-label="Tag filter">
          <option value="" data-i18n="news_tag_all">Усі теги</option>
        </select>
      </div>

      <div id="postsGrid" class="posts-grid"></div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <div class="muted">© <span id="year"></span> Strichkotkatska Fabryka</div>
      <div class="muted"><a href="contacts.html" data-i18n="footer_contacts">Контакти</a></div>
    </div>
  </footer>

  <script src="assets/js/theme.js"></script>
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/news.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
